name: Daily SGX Analysis

on:
  schedule:
    - cron: '30 17 * * 1-5'  # 4 PM SGT = 8 AM UTC
  workflow_dispatch:

jobs:
  sgx-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # ✅ Add this
      
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run screener
        run: python sgx_screener.py
      
      - name: Save results
        run: |
          mkdir -p reports
          mv SGX_Stock_Screen*.xlsx reports/ || true
      
      - name: Commit & push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SGX Bot"
          git add reports/
          git commit -m "SGX Daily Analysis - $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push  # ✅ This should now work
